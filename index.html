<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mientowa Guma – Klub Młodzieżowy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1ec;
    color: #1f1f1f;
}

/* ===== HEADER & MENU ===== */
header {
    background: #1f1f1f;
    padding: 15px 20px;
    position: sticky;
    top: 0;
    z-index: 1100;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #2ec4b6;
    font-weight: bold;
    font-size: 1.4rem;
}

/* LINKS */
.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: #2ec4b6;
    text-decoration: none;
    font-weight: bold;
}

/* ===== HAMBURGER ===== */
.hamburger {
    width: 30px;
    height: 22px;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
}

.hamburger span {
    height: 4px;
    width: 100%;
    background: #2ec4b6;
    border-radius: 2px;
    transition: 0.3s;
}

.hamburger.active span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
}
.hamburger.active span:nth-child(2) {
    opacity: 0;
}
.hamburger.active span:nth-child(3) {
    transform: rotate(-45deg) translate(6px, -6px);
}

/* ===== MOBILE MENU ===== */
@media (max-width: 768px) {
    .hamburger {
        display: flex;
    }

    .nav-links {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        flex-direction: column;
        background: #1f1f1f;
        padding: 30px 0;
        transform: translateY(-120%);
        transition: 0.4s ease;
        z-index: 1200;
    }

    .nav-links.active {
        transform: translateY(0);
    }

    .nav-links a {
        padding: 15px 0;
        text-align: center;
    }
}

/* ===== BLUR OVERLAY ===== */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 1000;
}

.overlay.active {
    opacity: 1;
    pointer-events: all;
}

/* ===== SEKCJE ===== */
section {
    max-width: 1000px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

.hero {
    background: #2ec4b6;
    padding: 60px 20px;
}

.hero img {
    max-width: 300px;
    width: 90%;
}

h1 {
    font-size: 3rem;
    margin: 20px 0 10px;
}

/* ===== GALERIA ===== */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.gallery img {
    width: 100%;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* ===== LIGHTBOX ===== */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
}

/* ===== KONTAKT ===== */
.socials {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

.socials a {
    text-decoration: none;
    border: 2px solid #2ec4b6;
    padding: 10px 18px;
    border-radius: 30px;
    color: #1f1f1f;
    font-weight: bold;
}

/* ===== FOOTER ===== */
footer {
    background: #1f1f1f;
    color: white;
    padding: 25px;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <div class="navbar">
        <div class="logo">Mientowa Guma</div>

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="nav-links" id="menu">
            <a href="#start">Start</a>
            <a href="#galeria">Galeria</a>
            <a href="#kontakt">Kontakt</a>
        </nav>
    </div>
</header>

<div class="overlay" onclick="toggleMenu()"></div>

<section class="hero" id="start">
    <img src="logo-mientowa-guma.png" alt="Logo Mientowa Guma">
    <h1>Mientowa Guma</h1>
    <p>Klub młodzieżowy • kreatywność • chill</p>
</section>

<section id="galeria">
    <h2>Galeria</h2>
    <div class="gallery">
        <!-- PODMIEŃ NA SWOJE ZDJĘCIA -->
        <img src="img1.jpg" onclick="openLightbox(this.src)">
        <img src="img2.jpg" onclick="openLightbox(this.src)">
        <img src="img3.jpg" onclick="openLightbox(this.src)">
        <img src="img4.jpg" onclick="openLightbox(this.src)">
        <img src="img5.jpg" onclick="openLightbox(this.src)">
        <img src="img6.jpg" onclick="openLightbox(this.src)">
    </div>
</section>

<section id="kontakt">
    <h2>Kontakt</h2>
    <p>📧 <a href="mailto:mientowaguma67@gmail.com">mientowaguma67@gmail.com</a></p>

    <div class="socials">
        <a href="#" target="_blank">TikTok</a>
        <a href="#" target="_blank">Facebook</a>
        <a href="#" target="_blank">Instagram</a>
    </div>
</section>

<footer>
    © 2026 Mientowa Guma
</footer>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<script>
function toggleMenu() {
    const menu = document.getElementById("menu");
    const burger = document.querySelector(".hamburger");
    const overlay = document.querySelector(".overlay");

    menu.classList.toggle("active");
    burger.classList.toggle("active");
    overlay.classList.toggle("active");
}

document.querySelectorAll(".nav-links a").forEach(link => {
    link.addEventListener("click", () => {
        document.getElementById("menu").classList.remove("active");
        document.querySelector(".hamburger").classList.remove("active");
        document.querySelector(".overlay").classList.remove("active");
    });
});

function openLightbox(src) {
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = src;
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
